aid: datacore
name: Datacore
description: >-
  DataCore Software is a software-defined storage and data management vendor
  serving approximately 15,000 customers worldwide, from Fortune 500 enterprises
  to small and medium businesses. Its portfolio includes SANsymphony (SAN and HCI
  storage virtualization), Swarm (scalable S3-compatible object storage for
  archives and backups), Nexus (a high-performance parallel file system for HPC
  and AI workloads), Puls8 (container-native persistent storage for Kubernetes),
  and StarWind hyperconverged infrastructure for edge, ROBO, and SMB deployments.
  DataCore does not publish a public developer portal or OpenAPI-described REST
  API; programmatic access is delivered through product-embedded interfaces and
  open-source integration plugins (CSI, Docker Volume Plugin, OpenStack Cinder)
  maintained on its GitHub organization.
